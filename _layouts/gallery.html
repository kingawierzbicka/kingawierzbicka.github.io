---
layout: default
gallery_js: lightbox
---
{%- assign items = site.data[page.data_file] -%}
<div class="gallery-page">
  <p class="eyebrow">{{ page.title | escape }}</p>
  <h2 class="section">{{ items.size }} works</h2>

  <div class="rows">
    {%- for item in items -%}
    <figure class="shot">
      <button type="button" class="open"
              data-full="{{ item.file | relative_url }}"
              data-index="{{ forloop.index0 }}"
              data-title="{{ item.title | escape }}"
              data-meta="{% if item.medium %}{{ item.medium | escape }}{% endif %}{% if item.dimensions %} · {{ item.dimensions | escape }}{% endif %}{% if item.year %} · {{ item.year | escape }}{% endif %}">
        <img src="{{ item.file | relative_url }}" alt="{{ item.title | default: item.name | escape }}">
      </button>
      {%- if item.title or item.medium or item.year -%}
      <figcaption class="cap">
        {%- if item.title %}<div class="t">{{ item.title | escape }}</div>{% endif -%}
        {%- if item.medium or item.dimensions or item.year -%}
        <div class="m">{% if item.medium %}{{ item.medium | escape }}{% endif %}{% if item.dimensions %} · {{ item.dimensions | escape }}{% endif %}{% if item.year %} · {{ item.year | escape }}{% endif %}</div>
        {%- endif -%}
      </figcaption>
      {%- endif -%}
    </figure>
    {%- endfor -%}
  </div>
</div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Artwork viewer" aria-hidden="true">
  <div class="lb-bar">
    <span class="lb-count" aria-live="polite"></span>
    <button type="button" class="lb-close" aria-label="Close viewer">&times;</button>
  </div>
  <div class="lb-stage"><img class="lb-img" src="" alt=""></div>
  <div class="lb-cap" aria-live="polite"></div>
  <button type="button" class="lb-nav lb-prev" aria-label="Previous work">&#10094;</button>
  <button type="button" class="lb-nav lb-next" aria-label="Next work">&#10095;</button>
</div>
