---
layout: default
---
<div class="home">
  <div class="stmt">{{ content }}</div>

  <p class="eyebrow">The work</p>
  <div class="cats">
    {%- assign cats = "paintings,pastels,sketches" | split: "," -%}
    {%- for slug in cats -%}
      {%- assign items = site.data[slug] -%}
      {%- assign cover = items[0].file -%}
      <figure>
        <a href="{{ "/" | append: slug | append: "/" | relative_url }}">
          <img src="{{ cover | relative_url }}" alt="{{ slug | capitalize }}">
        </a>
        <figcaption>{{ slug | capitalize }}<div class="n">{{ items.size }} works</div></figcaption>
      </figure>
    {%- endfor -%}
  </div>
</div>
