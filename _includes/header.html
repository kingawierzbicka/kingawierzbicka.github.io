<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{ "/" | relative_url }}">Kinga Wierzbicka</a>
    <div class="hdr-links">
      <a class="icon-link" href="https://instagram.com/kingawillow" rel="me noopener" aria-label="Kinga Wierzbicka on Instagram">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4.2"/>
          <circle cx="17.4" cy="6.6" r="1.1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
      <button type="button" class="menu-btn" aria-expanded="false" aria-controls="site-menu" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
          <line x1="3" y1="6.5" x2="21" y2="6.5"/>
          <line x1="3" y1="12" x2="21" y2="12"/>
          <line x1="3" y1="17.5" x2="21" y2="17.5"/>
        </svg>
      </button>
    </div>
  </div>
  <nav class="site-menu" id="site-menu" aria-label="Site" hidden>
    <div class="wrap menu-col">
      <a href="{{ "/" | relative_url }}"{% if page.url == "/" %} aria-current="page"{% endif %}>Home</a>
      {%- if site.posts.size > 0 %}
      <a href="{{ "/blog/" | relative_url }}"{% if page.url == "/blog/" %} aria-current="page"{% endif %}>Blog</a>
      {%- endif %}
      <span class="menu-label">Gallery</span>
      <span class="sub">
        <a href="{{ "/paintings/" | relative_url }}"{% if page.url == "/paintings/" %} aria-current="page"{% endif %}>Paintings</a>
        <a href="{{ "/drawings/" | relative_url }}"{% if page.url == "/drawings/" %} aria-current="page"{% endif %}>Drawings</a>
        <a href="{{ "/pastels/" | relative_url }}"{% if page.url == "/pastels/" %} aria-current="page"{% endif %}>Pastels</a>
      </span>
      <a href="{{ "/about/" | relative_url }}"{% if page.url == "/about/" %} aria-current="page"{% endif %}>About</a>
    </div>
  </nav>
</header>
