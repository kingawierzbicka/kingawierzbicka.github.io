# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: Kinga Wierzbicka

# TODO: awaiting the artist's decision on which address to publish.
# email:

# Kinga's own artist statement -- her approved public words (2026-07-29). Used as
# the meta description, og:description, JSON-LD description, and the <title> suffix,
# i.e. what Google and every shared link display.
description: >- # this means to ignore newlines until "baseurl:"
  My work is rooted in the timeless mediums of oil paints, oil pastels, charcoal,
  and ink. Whether painting en plein air or working with live models in the studio,
  I strive to capture the moment in every stroke.

# Short factual descriptor. jekyll-seo-tag uses site.tagline (not site.description)
# for the homepage <title> suffix, so the title stays concise -- "Kinga Wierzbicka |
# Painter ..." -- while the full statement above remains the meta/og description.
tagline: "Painter · oil, pastel, charcoal, ink"

baseurl: "" # the subpath of your site, e.g. /blog
url: "https://kingawierzbicka.art" # required, or jekyll-seo-tag emits a broken canonical

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed
  - jekyll-sitemap # bundled with the github-pages gem; no Gemfile change needed

# Analytics -- GA4 measurement ID (G-XXXXXXXXXX). Rendered only in production, and
# only after the visitor accepts, via _includes/google-analytics.html.
# google_analytics: G-XXXXXXXXXX

# Google Search Console verification token (jekyll-seo-tag renders the meta tag).
# google_site_verification:

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
